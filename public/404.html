<!DOCTYPE html>
<html>
    <head>
        <meta http-equiv="refresh" content="0;url=/Three-with-Blender/" />
    </head>
    <body>
        <p>Redirecting...</p>
        <script>
            // Preserve the actual route when redirecting
            var pathname = window.location.pathname
            var newPath = '/Three-with-Blender' + pathname.replace(/^\/Three-with-Blender/, '')
            window.location.replace(newPath)
        </script>
    </body>
</html>
